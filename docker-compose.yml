version: "3.8"

services:
  netbird-client:
    build:
      context: .
      dockerfile: client/Dockerfile.multistage
    image: netbird-client-local:latest
    container_name: netbird-isolated
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./netbird-data:/var/lib/netbird
      - ./netbird-data:/etc/netbird
    environment:
      - NB_MANAGEMENT_URL=${NB_MANAGEMENT_URL:-https://api.netbird.io:443}
      - NB_SETUP_KEY=${NB_SETUP_KEY}
      - NB_LOG_LEVEL=${NB_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "netbird", "status", "-C", "live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
